<!DOCTYPE html>
<html lang="en">
<head>
   <title>Liquid metaballs · ShaderMate examples</title>
   <meta name="description" content="Glossy blobs that merge and split. One of them follows your cursor and grows while you hold the button.">
   <!--HEAD-->
   <style>html, body { height: 100%; overflow: hidden; background: #05050a }</style>
</head>
<body>
   <!--BACK-->
   <div class="hint"><b>move</b> to drag a blob · <b>hold</b> to grow it · <kbd>S</kbd> screenshot</div>

   <script src="../../lib/shadermate.js"></script>
   <script>
      // Each blob is a Gaussian bump; the surface is where their sum crosses 0.5. The gradient of that sum is
      // computed analytically, which gives smooth normals for the lighting (no screen-space derivatives).
      const sm = ShaderMate.createShader({
         pointer: { smooth: 0.15 },
         shader: `
            vec3 neon(float t) { return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67))); }

            void mainImage(out vec4 o, in vec2 fc) {
               vec2 uv = (fc - 0.5 * iResolution.xy) / iResolution.y;
               float t = iTime * 0.6, aspect = iResolution.x / iResolution.y;

               float field = 0.0;
               vec2 grad = vec2(0.0);
               for (int i = 0; i < 9; i++) {
                  float k = float(i), size = 0.02;
                  vec2 p = vec2(sin(t * (0.5 + k * 0.07) + k * 2.1) * aspect * 0.38, cos(t * (0.6 + k * 0.05) + k * 1.3) * 0.32);
                  if (i == 8) {                                     // the one you drive
                     p = iMouse.x > 0.0 ? (iMouse.xy - 0.5 * iResolution.xy) / iResolution.y : vec2(cos(t * 1.3) * aspect * 0.3, sin(t * 1.7) * 0.25);
                     size = iMouse.z > 0.0 ? 0.09 : 0.04;
                  }
                  float g = exp(-dot(uv - p, uv - p) / size);
                  field += g;
                  grad -= 2.0 * (uv - p) / size * g;
               }

               vec3 n = normalize(vec3(-grad * 0.15, 1.0));
               vec3 L = normalize(vec3(-0.5, 0.6, 0.7));
               float diff = max(dot(n, L), 0.0);
               float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 60.0);
               vec3 blob = neon(0.62 + (1.0 - n.z) * 0.9 + uv.x * 0.15 + t * 0.05) * (0.25 + 0.8 * diff) + spec * 1.2;

               vec3 bg = vec3(0.02, 0.02, 0.05);
               bg += (1.0 - smoothstep(0.0, 0.1, length(fract(uv * 14.0) - 0.5))) * 0.07;
               bg += vec3(0.45, 0.3, 1.0) * 0.25 * min(field, 1.0);
               o = vec4(mix(bg, blob, smoothstep(0.48, 0.52, field)), 1.0);
            }`,
      });
      addEventListener('keydown', e => { if (e.key === 's') sm.download('metaballs.png'); });
   </script>
</body>
</html>
