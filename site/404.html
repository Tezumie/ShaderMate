<script src="lib/shadermate.js"></script>
<script>
  // A slowly drifting signal-lost field. Move the mouse to tune it in.
  ShaderMate.createShader({
    canvas: '#bg', maxPixelRatio: 1, errorOverlay: false, pointer: { smooth: 0.08 },
    shader: `
      float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      void mainImage(out vec4 o, in vec2 fc) {
        vec2 uv = fc / iResolution.xy;
        float tune = iMouse.x > 0.0 ? iMouse.x / iResolution.x : 0.5 + 0.3 * sin(iTime * 0.2);
        float band = floor(uv.y * 60.0 + iTime * 3.0);
        float shift = (hash(vec2(band, floor(iTime * 8.0))) - 0.5) * 0.04 * (1.0 - tune);
        vec2 p = (fc - 0.5 * iResolution.xy) / iResolution.y + vec2(shift, 0.0);
        float rings = sin(length(p) * 18.0 - iTime * 1.5 + tune * 6.0);
        vec3 col = 0.5 + 0.5 * cos(6.28318 * (length(p) * 0.4 - iTime * 0.05 + vec3(0.0, 0.33, 0.67)));
        col *= 0.18 + 0.12 * rings;
        col += (hash(fc + fract(iTime * 7.0)) - 0.5) * 0.12 * (1.0 - tune * 0.7);
        col *= 1.0 - 0.6 * dot(uv - 0.5, uv - 0.5) * 2.0;
        o = vec4(col, 1.0);
      }`,
  });
</script>
